<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syncout — two workouts, one screen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1115'/%3E%3Ccircle cx='38' cy='36' r='10' fill='%23ff4655'/%3E%3Cpath d='M38 46 L38 72 M38 56 L26 66 M38 56 L50 66 M38 72 L28 88 M38 72 L48 88' stroke='%23ff4655' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='68' cy='42' r='10' fill='%232dd4bf'/%3E%3Cpath d='M68 52 L68 72 M68 58 L58 66 M68 58 L78 66 M68 72 L60 86 M68 72 L76 86' stroke='%232dd4bf' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand" onclick="App.home()">
    <span class="logo">sync<b>out</b></span>
    <span class="tag">two workouts, one screen</span>
  </div>
  <div class="lan" title="Open this address on your iPhone or TV">this device: <b id="lanip">…</b></div>
</header>

<main>

  <section id="home-view" class="view">
    <h1>Train side by side.</h1>
    <p class="lead">Pick a mode. No equipment needed — his build uses bodyweight only, hers needs just a mat.</p>
    <div class="mode-grid">
      <button class="mode-card him" onclick="App.solo('him')">
        <div class="mode-head">
          <span class="mode-title">His workout</span>
          <span class="mode-goal">Broad shoulders · V-taper · lean muscle</span>
        </div>
        <div class="mode-body">Push-ups, pikes, dips, rows, squats, core — everything to build that full-body look.</div>
      </button>
      <button class="mode-card her" onclick="App.solo('her')">
        <div class="mode-head">
          <span class="mode-title">Her workout</span>
          <span class="mode-goal">Pilates · strength · mobility</span>
        </div>
        <div class="mode-body">Mat pilates flow — core, glutes, legs and stretch. All you need is a yoga mat.</div>
      </button>
      <button class="mode-card split" onclick="App.split()">
        <div class="mode-head">
          <span class="mode-title">Split screen</span>
          <span class="mode-goal">Both at the same time</span>
        </div>
        <div class="mode-body">His plan on the left, hers on the right. Independent timers — you each move at your own pace.</div>
      </button>
    </div>
  </section>

  <section id="setup-view" class="view" hidden>
    <button class="back" onclick="App.home()">← Home</button>
    <h2 id="setup-title">Choose your session</h2>
    <div class="setup-cols" id="setup-cols"></div>
    <div class="setup-foot">
      <button class="btn primary" id="start-btn" onclick="App.begin()">Start workout</button>
    </div>
  </section>

  <section id="workout-view" class="view" hidden>
    <div id="panels" class="panels"></div>
  </section>

</main>

<script src="anim.js"></script>
<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
